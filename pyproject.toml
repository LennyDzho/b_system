[project]
name = "test-task"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13,<4.0"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "clickhouse-connect[async]==1.0.1",
    "dishka>=1.7.2",
    "environs>=14.5.0",
    "fastapi>=0.123.0",
    "httpx>=0.28.1",
    "jinja2==3.1.6",
    "pwdlib[argon2]==0.3.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.43,<3.0.0",
    "taskiq-aio-pika>=0.5.0",
    "taskiq-fastapi>=0.4.0",
    "uvicorn>=0.38.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires real PostgreSQL and ClickHouse"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[dependency-groups]
dev = [
    "ruff==0.14.5",
]
