<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Финансы портфеля{% endblock %} · Villa Finance</title><link rel="stylesheet" href="/static/finance.css"><script defer src="/static/auth.js"></script><script defer src="/static/finance.js"></script></head>
